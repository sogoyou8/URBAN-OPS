# OPT-IN local PostgreSQL, not launched by this package.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urbanops
      POSTGRES_PASSWORD: local_dev_only_change_me
      POSTGRES_DB: urbanops
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - urbanops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanops -d urbanops"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  urbanops_pgdata:
