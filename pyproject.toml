[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-ops"
version = "0.3.0"
description = "Vélib' data engineering pipeline: Bronze / Silver / Gold"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "SQLAlchemy>=2.0,<3"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
test = ["pytest>=8,<10"]

[tool.setuptools.package-data]
urban_ops = ["sql/*.sql"]

[project.scripts]
urban-ops = "urban_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
