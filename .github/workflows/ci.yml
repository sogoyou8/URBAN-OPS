name: P3 data pipeline checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: urbanops
          POSTGRES_PASSWORD: urbanops_test_only
          POSTGRES_DB: urbanops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urbanops -d urbanops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      URBAN_OPS_TEST_DATABASE_URL: postgresql+psycopg://urbanops:urbanops_test_only@127.0.0.1:5432/urbanops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[postgres,test,ml]'
      - run: python -m compileall -q src tests
      - run: python -m pytest -q
