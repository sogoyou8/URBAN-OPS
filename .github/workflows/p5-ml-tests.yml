name: P5 forecasting model and leakage safety tests
on:
  pull_request:
    paths:
      - 'src/urban_ops/p5.py'
      - 'scripts/p5_inventory.py'
      - 'scripts/train_p5.py'
      - 'tests/test_p5_forecasting.py'
      - 'pyproject.toml'
      - '.github/workflows/p5-ml-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/urban_ops/p5.py'
      - 'scripts/p5_inventory.py'
      - 'scripts/train_p5.py'
      - 'tests/test_p5_forecasting.py'
      - 'pyproject.toml'
      - '.github/workflows/p5-ml-tests.yml'
permissions:
  contents: read
jobs:
  forecast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ML and test dependencies
        run: python -m pip install -e '.[test,ml]'
      - name: Exercise data gates, 30-minute labels, real learner and holdout
        run: python -m pytest -q tests/test_p5_forecasting.py