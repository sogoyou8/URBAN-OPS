name: P6 Urban Ops cockpit — checks and verified real snapshot
on:
  pull_request:
    paths:
      - 'web/**'
      - 'scripts/export_p6.py'
      - 'scripts/diagnose_p3_capture.py'
      - 'scripts/p5_inventory.py'
      - 'scripts/p5_exploratory.py'
      - 'tests/test_p5_exploratory.py'
      - 'docs/C3_PUBLICATION_CHECKLIST.md'
      - 'tests/test_p6_export.py'
      - 'scripts/sync-p6.ps1'
      - 'scripts/package_p6_public.py'
      - 'web/src/check_p69_browser.mjs'
      - 'tests/test_p69_publication.py'
      - 'docs/P69_PUBLICATION_READINESS.md'
      - '.github/workflows/p6-cockpit.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/export_p6.py'
      - 'scripts/diagnose_p3_capture.py'
      - 'scripts/p5_inventory.py'
      - 'scripts/p5_exploratory.py'
      - 'tests/test_p5_exploratory.py'
      - 'docs/C3_PUBLICATION_CHECKLIST.md'
      - 'tests/test_p6_export.py'
      - 'scripts/sync-p6.ps1'
      - 'scripts/package_p6_public.py'
      - 'web/src/check_p69_browser.mjs'
      - 'tests/test_p69_publication.py'
      - 'docs/P69_PUBLICATION_READINESS.md'
      - '.github/workflows/p6-cockpit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cockpit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing P3 dependencies and pytest
        run: python -m pip install -e '.[test]'
      - name: Validate Python SQL export and JavaScript selectors
        run: |
          python -m pytest -q tests/test_p6_export.py tests/test_p69_publication.py tests/test_p5_exploratory.py
          node --check web/src/main.js
          node --test web/src/core.test.mjs
      - name: Reject fixture-like data shipped as real
        run: |
          if [ -f web/data/network.json ]; then
            echo 'Generated dataset must not be tracked in git' >&2
            exit 1
          fi
  browser-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: browser
      - name: Install headless browser driver without any deployment
        working-directory: web
        run: npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Exercise synthetic screen fixture in Chromium (never publish its data)
        working-directory: web
        env:
          P6_CHROME: ${{ steps.browser.outputs.chrome-path }}
        run: node src/browser-smoke.mjs
  real-export:
    if: github.event_name != 'pull_request'
    needs: cockpit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified P3 replay and SQL exporter
        run: python -m pip install -e .
      - name: Download real capture archives from up to three latest release days
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/p6-captures
          gh api "repos/$GH_REPO/releases?per_page=30" --jq '.[].tag_name' \
            | grep '^velib-data-' | sort -r | head -n 3 > /tmp/p6-tags.txt
          test -s /tmp/p6-tags.txt || { echo 'No durable P3 archive found; cannot export P6.' >&2; exit 1; }
          while IFS= read -r tag; do
            gh release download "$tag" -R "$GH_REPO" --pattern 'capture-*.tar.gz' --dir data/p6-captures
          done < /tmp/p6-tags.txt
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('data/p6-captures').glob('capture-*.tar.gz'), reverse=True)
          if not files: raise SystemExit('No archived real captures; refuse synthetic fallback.')
          chosen = sorted(files[:48])
          Path('/tmp/p6-selected.txt').write_text('\n'.join(str(p) for p in chosen)+'\n')
          print(f'P6: {len(files)} P3 archives available; replaying {len(chosen)} newest real archives')
          PY
      - name: Verify SHA-256 and reconstruct SQL facts from real captures
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t captures < /tmp/p6-selected.txt
          python -m scripts.replay_capture --db-url sqlite:///./data/p6-real.sqlite "${captures[@]}" > data/p6-replay.json
      - name: Install P5 exploratory candidate dependencies (not a production model)
        run: python -m pip install -e '.[ml]'
      - name: Trial P5 on existing verified archives without promoting or exporting forecasts
        run: |
          python -m scripts.p5_exploratory --db-url sqlite:///./data/p6-real.sqlite --replay-evidence data/p6-replay.json --output data/p5-exploratory
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/p5-exploratory/P5_EXPLORATORY_ONLY.json').read_text())
          assert s['production_status']=='NOT_VALIDATED'
          assert s['safe_to_publish_forecasts'] is False
          assert s['prediction_rows']==0 and s['model_exported'] is False
          print('P5 EXPLORATORY, NEVER a production forecast:',s['status'])
          print('Real qualified +30m sample counts:',s.get('real_label_pairs'))
          print('Baseline on held-out slice (NOT 7-day validation):',s.get('baseline_only'))
          if 'provisional_candidate' in s:
              print('Candidate trial only:',s['provisional_candidate'])
          PY
      - name: Preserve real P5 provisional evidence, never model or forecasts
        uses: actions/upload-artifact@v4
        with:
          name: urban-ops-p5-exploratory-only
          path: data/p5-exploratory/P5_EXPLORATORY_ONLY.json
          retention-days: 14
      - name: Diagnose any zero-usable archived P3 collections (forensic, no guesses)
        run: |
          python -m scripts.diagnose_p3_capture --db-url sqlite:///./data/p6-real.sqlite --output data/p6-quality-diagnostic.json
      - name: Preserve quality diagnostics from the verified P3 replay
        uses: actions/upload-artifact@v4
        with:
          name: urban-ops-p3-zero-usable-diagnostic
          path: data/p6-quality-diagnostic.json
          retention-days: 14
      - name: Inventory P5 readiness from last ten days of GitHub asset names
        run: python -m scripts.p5_inventory --repo "$GH_REPO" --output data/p5-inventory.json
      - name: Export actual map, station metrics, history and qualified readiness
        run: |
          python -m scripts.export_p6 --db-url sqlite:///./data/p6-real.sqlite --output web/data/network.json --p5-inventory data/p5-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('web/data/network.json').read_text())
          assert d['dataset_type']=='archived_p3_observations' and d['metrics']['stations'] > 1000, d.get('metrics')
          assert d['metrics']['observed'] > 1000, d.get('metrics')
          assert d['forecast']['status']=='unavailable', 'Prediction not validated'
          assert d['p5_readiness']['source'].startswith('GitHub Release asset names')
          assert d['quality_diagnostics']['not_observed']+d['quality_diagnostics']['observed_but_unusable'] == d['metrics']['stations']-d['metrics']['usable']
          print('P5 archive-name inventory (NOT validated ML):',json.dumps(d['p5_readiness'],sort_keys=True))
          print('P6 verified real observations:',json.dumps({'at':d['captured_at'],'stations':d['metrics']['stations'],'captures':d['metrics']['capture_count']},sort_keys=True))
          PY
      - name: Upload only public observations for local sync, no paid deployment
        uses: actions/upload-artifact@v4
        with:
          name: urban-ops-p6-real-data
          path: web/data/network.json
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: p69_chrome
      - name: Install pinned-version runtime map and CI browser driver
        working-directory: web
        run: npm install --no-save --ignore-scripts --no-audit --no-fund maplibre-gl@4.7.1 puppeteer-core@24
      - name: Package verified archive and audit SHA-256 / CSP / provenance
        run: |
          python -m scripts.package_p6_public --source web --out dist/p6-public --vendor web/node_modules/maplibre-gl/dist --replay-evidence data/p6-replay.json --max-age-hours 24
          python -m scripts.package_p6_public --out dist/p6-public --verify-only
      - name: Browser smoke on FINAL immutable archived-data bundle (never deploy)
        env:
          P6_CHROME: ${{ steps.p69_chrome.outputs.chrome-path }}
        run: node web/src/check_p69_browser.mjs dist/p6-public
      - name: Preserve C1+C2 real-data visual QA captures (not a deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urban-ops-p6-c1c2-visual-qa
          path: data/p6-c1c2-qa/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload audited P6.9 publication-ready artifact ONLY (no hosting)
        uses: actions/upload-artifact@v4
        with:
          name: urban-ops-p69-publication-ready
          path: dist/p6-public/
          include-hidden-files: true
          retention-days: 7