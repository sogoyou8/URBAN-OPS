name: Urban Ops V2.4 — future independent evaluation (NO DEPLOY)

on:
  workflow_dispatch:
  push:
    branches: [research/v2-4-future-holdout]
    paths:
      - '.github/workflows/v24-evaluate.yml'
      - 'docs/V24_EVALUATION_TRIGGER.md'

permissions:
  contents: read
  actions: read

concurrency:
  group: urban-ops-v24-independent-future-test
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'sogoyou8/URBAN-OPS' && github.ref == 'refs/heads/research/v2-4-future-holdout'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      eligible: ${{ steps.future.outputs.ready }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin the evaluation implementation at the pre-holdout commit.
          ref: 69971d07bbde5737da2e985f0b19952e20fee79c
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only P3 inventory and protocol checks
        run: python -m pip install -e '.[test]'
      - name: Verify preregistered gates before reading any future labels
        run: python -m pytest -q tests/test_v24_protocol.py
      - name: Check future dates and archive names only — NO EVALUATION BEFORE NOV 4
        id: future
        run: python -m scripts.v24_inventory --repo "$GH_REPO" --output data/v24-inventory.json
      - name: Preserve immutable, explicitly NOT_READY evidence when too early
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urban-ops-v24-preflight-${{ github.run_id }}
          path: data/v24-inventory.json
          if-no-files-found: ignore
          retention-days: 30

  independent-evaluation:
    needs: preflight
    if: needs.preflight.outputs.eligible == 'true' && github.repository == 'sogoyou8/URBAN-OPS' && github.ref == 'refs/heads/research/v2-4-future-holdout'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FREEZE_RUN_ID: "40495787979"
      FREEZE_SHA: "69971d07bbde5737da2e985f0b19952e20fee79c"
    steps:
      - uses: actions/checkout@v4
        with:
          # No cherry-picks or experimental changes after outcome exposure.
          ref: 69971d07bbde5737da2e985f0b19952e20fee79c
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked research evaluator and classifier dependencies
        run: python -m pip install -e '.[ml]'
      - name: Validate freeze run identity and download its PRE-window model/manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/v24-frozen
          gh api "repos/$GH_REPO/actions/runs/$FREEZE_RUN_ID" > data/v24-freeze-run.json
          python - <<'PY'
          import json, os
          from datetime import datetime,timezone
          d=json.load(open('data/v24-freeze-run.json'))
          assert d['conclusion']=='success', 'Research freeze workflow did not succeed'
          assert d['head_sha']==os.environ['FREEZE_SHA'], 'Freeze provenance is not pinned'
          assert datetime.fromisoformat(d['created_at'].replace('Z','+00:00')) < datetime(2026,10,28,tzinfo=timezone.utc), 'Freeze occurred after embargo'
          PY
          gh run download "$FREEZE_RUN_ID" -R "$GH_REPO" \
            -n "urban-ops-v24-pre-frozen-$FREEZE_RUN_ID" -D data/v24-frozen
          test -s data/v24-frozen/v24_frozen_challenger_research_only.joblib
          test -s data/v24-frozen/V24_FROZEN_MANIFEST.json
      - name: Select exclusively the seven UTC dates of newly collected archives
        run: python -m scripts.v24_inventory --repo "$GH_REPO" --output data/v24-future-inventory.json
      - name: Download future GitHub Release captures Oct 28 through Nov 3 UTC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/v24-future-archives
          python - <<'PY' > /tmp/v24-future-tags.txt
          import json
          info=json.load(open('data/v24-future-inventory.json'))
          assert info['ready'], 'Future proof not ready'
          for tag in info['selected_release_tags']:
              print(tag)
          PY
          while IFS= read -r tag; do
            gh release download "$tag" -R "$GH_REPO" --pattern 'capture-*.tar.gz' --dir data/v24-future-archives
          done < /tmp/v24-future-tags.txt
          test "$(find data/v24-future-archives -name 'capture-*.tar.gz' | wc -l)" -ge 900
      - name: Verify all historical capture SHA-256 and rebuild FUTURE ONLY observations
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' archives < <(find data/v24-future-archives -name 'capture-*.tar.gz' -print0 | sort -z)
          python -m scripts.replay_capture --db-url sqlite:///./data/v24-future.sqlite "${archives[@]}" > data/v24-future-replay.json
      - name: Score frozen model on untouched future week and enforce no-promotion rules
        run: |
          python -m scripts.v24_evaluate \
            --db-url sqlite:///./data/v24-future.sqlite \
            --replay-evidence data/v24-future-replay.json \
            --frozen-model data/v24-frozen/v24_frozen_challenger_research_only.joblib \
            --frozen-manifest data/v24-frozen/V24_FROZEN_MANIFEST.json \
            --output data/v24-future-results
      - name: Store JSON audit ONLY — no V1 deploy, forecast CSV, or model export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urban-ops-v24-future-audit-${{ github.run_id }}
          path: |
            data/v24-future-inventory.json
            data/v24-future-results/V24_FUTURE_HOLDOUT_REPORT.json
          if-no-files-found: warn
          retention-days: 30
