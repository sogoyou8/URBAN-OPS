name: P3.5 collector coverage and freshness audit
on:
  workflow_dispatch:
  schedule:
    - cron: '19 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/collector-health.yml'
      - 'scripts/audit_collector.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit every real release asset, with API pagination
        run: |
          python -m scripts.audit_collector \
            --repo "$GH_REPO" --window-hours 24 --cadence-minutes 5 \
            --stale-minutes 90 --fail-on-stale --fail-on-degraded \
            --summary "$GITHUB_STEP_SUMMARY" --json-out collector-health.json
      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p35-collector-health-${{ github.run_id }}
          path: collector-health.json
          if-no-files-found: ignore
          retention-days: 7
